# ShopSphere CI/CD: feature/shopsphere -> build/test -> ACR -> AKS

trigger:
  branches:
    include:
      - none
  paths:
    include:
      - backend/**
      - frontend/**
      - k8s/**
      - app/**
      - azure-pipelines.yml
      - docker-compose.yml
      - .gitignore

pr: none

parameters:
  - name: updateDbPassword
    displayName: Update db-password in Key Vault from secret variable dbPassword
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

variables:
  imageRepositoryBackend: shopsphere-backend
  imageRepositoryFrontend: shopsphere-frontend
  dockerRegistryServiceConnection: shopsphere-acr
  azureServiceConnection: shopsphere-azure
  resourceGroup: Test_Rg
  aksCluster: shopsphere-aks
  namespace: shopsphere
  keyVaultName: shopsphere-kv
  # Build ID creates a unique tag for each pipeline run.
  imageTag: '$(Build.BuildId)'

stages:
  # Stage 1: Validate the backend and frontend.
  - stage: Validate
    displayName: Validate application
    jobs:
      - job: ValidateBackend
        displayName: Validate Spring Boot backend
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: Use Java 21
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - script: mvn -B -f backend/pom.xml verify
            displayName: Maven verify

          - task: NodeTool@0
            displayName: Use Node.js 22
            inputs:
              versionSpec: '22.x'

          - script: |
              npm ci
              npm run build
            workingDirectory: frontend
            displayName: Build React frontend

  # Stage 2: Build container images and push them to ACR.
  - stage: BuildAndPush
    displayName: Build and push images to ACR
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: BuildImages
        displayName: Build container images
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and push backend image
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepositoryBackend)
              Dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                $(imageTag)

          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepositoryFrontend)
              Dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                $(imageTag)

  # Stage 3: Deploy the application to AKS.
  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - deployment: DeployShopSphere
        displayName: Deploy ShopSphere to AKS
        environment: shopsphere-aks
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # First create the namespace.
                - task: KubernetesManifest@1
                  displayName: Create ShopSphere namespace
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(azureServiceConnection)
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: default
                    manifests: |
                      k8s/namespace.yaml

                # OPTIONAL: only runs when the "updateDbPassword" box is ticked at run time.
                # Requires a secret pipeline variable named dbPassword.
                - ${{ if eq(parameters.updateDbPassword, true) }}:
                    - task: AzureCLI@2
                      displayName: Update db-password in Key Vault
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          az keyvault secret set \
                            --vault-name "$(keyVaultName)" \
                            --name db-password \
                            --value "$DB_PASSWORD" \
                            --output none
                          echo "db-password updated in Key Vault."
                      env:
                        DB_PASSWORD: $(dbPassword)

                    # Delete the synced secret so new pods rebuild it from Key Vault.
                    - task: Kubernetes@1
                      displayName: Delete synced Kubernetes secret
                      inputs:
                        connectionType: Azure Resource Manager
                        azureSubscriptionEndpoint: $(azureServiceConnection)
                        azureResourceGroup: $(resourceGroup)
                        kubernetesCluster: $(aksCluster)
                        namespace: $(namespace)
                        command: delete
                        arguments: secret shopsphere-secrets --ignore-not-found=true

                # Then deploy resources into the existing namespace.
                - task: KubernetesManifest@1
                  displayName: Deploy ShopSphere resources
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: $(azureServiceConnection)
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: $(namespace)
                    manifests: |
                      k8s/configmap.yaml
                      k8s/service-account.yaml
                      k8s/secret-provider-class.yaml
                      k8s/backend-service.yaml
                      k8s/frontend-service.yaml
                      k8s/ingress.yaml
                      k8s/backend-deployment.yaml
                      k8s/frontend-deployment.yaml
                    containers: |
                      shopsphere.azurecr.io/$(imageRepositoryBackend):$(imageTag)
                      shopsphere.azurecr.io/$(imageRepositoryFrontend):$(imageTag)

                # Verify the backend deployment.
                - task: Kubernetes@1
                  displayName: Verify backend rollout
                  inputs:
                    connectionType: Azure Resource Manager
                    azureSubscriptionEndpoint: $(azureServiceConnection)
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: $(namespace)
                    command: rollout
                    arguments: status deployment/shopsphere-backend --timeout=180s

                # Verify the frontend deployment.
                - task: Kubernetes@1
                  displayName: Verify frontend rollout
                  inputs:
                    connectionType: Azure Resource Manager
                    azureSubscriptionEndpoint: $(azureServiceConnection)
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: $(namespace)
                    command: rollout
                    arguments: status deployment/shopsphere-frontend --timeout=180s