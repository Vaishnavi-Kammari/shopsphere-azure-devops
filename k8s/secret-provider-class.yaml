apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shopsphere-keyvault
  namespace: shopsphere
spec:
  provider: azure
  secretObjects:
    - secretName: shopsphere-secrets
      type: Opaque
      data:
        - objectName: db-password
          key: DB_PASSWORD
        - objectName: token-secret
          key: TOKEN_SECRET
        - objectName: admin-password
          key: ADMIN_PASSWORD
  parameters:
    usePodIdentity: "false"
    clientID: "5f37e3f5-589e-473a-aa19-b3b9087e4e74"
    keyvaultName: "shopsphere-kv"
    tenantId: "edd8ecd1-611a-4d2d-9dd8-d7fcc084bd94"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: token-secret
          objectType: secret
        - |
          objectName: admin-password
          objectType: secret